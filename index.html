<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GGLinker Dev - Privacy Center</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <h1>GGLinker Dev</h1>
    <span>Privacy Center</span>
  </div>
</header>

<div class="container">

  <aside class="sidebar">
    <input id="search" type="text" placeholder="Search products..." />
    <div id="productList"></div>
  </aside>

  <main class="content">

    <div id="welcome" class="welcome">
      <h2>Privacy Policies</h2>
      <p>Select a product to view its privacy policy.</p>
    </div>

    <div id="viewer" class="viewer hidden">
      <iframe id="policyFrame"></iframe>
    </div>

  </main>

</div>

<footer>
  <p>© <span id="year"></span> GGLinker Dev</p>
</footer>

<script src="script.js"></script>
</body>
</html>
